<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crypto Chart Dashboard</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>
  </head>
  <body data-theme="dark">
    <main class="app">
      <aside class="sidebar" aria-label="차트 메뉴">
        <header class="topbar">
          <section class="market">
            <div>
              <p id="marketSymbol" class="label">BTC/USDT</p>
              <h1>Crypto Chart</h1>
            </div>
            <div class="price-panel" aria-live="polite">
              <span id="lastPrice" class="price">--</span>
              <span id="priceChange" class="change">--</span>
            </div>
          </section>

          <section class="setting-panel" aria-label="암호화폐 선택">
            <label for="symbolSelect">암호화폐</label>
            <select id="symbolSelect">
              <option value="BTCUSDT">BTC</option>
              <option value="ETHUSDT">ETH</option>
              <option value="SOLUSDT">SOL</option>
              <option value="ADAUSDT">ADA</option>
              <option value="USDT.D">USDT.D</option>
            </select>
          </section>

          <section class="setting-panel" aria-label="배경 테마 선택">
            <span class="setting-label">배경 테마</span>
            <div class="radio-group">
              <label>
                <input type="radio" name="theme" value="dark" checked />
                <span>다크</span>
              </label>
              <label>
                <input type="radio" name="theme" value="light" />
                <span>화이트</span>
              </label>
            </div>
          </section>

          <section class="setting-panel" aria-label="Williams Fractals 적용">
            <span class="setting-label">Williams Fractals</span>
            <div class="radio-group">
              <label>
                <input type="radio" name="fractals" value="on" checked />
                <span>적용</span>
              </label>
              <label>
                <input type="radio" name="fractals" value="off" />
                <span>미적용</span>
              </label>
            </div>
          </section>

          <section class="setting-panel" aria-label="Order Block 적용">
            <span class="setting-label">Order Block</span>
            <div class="radio-group">
              <label>
                <input type="radio" name="orderBlock" value="on" checked />
                <span>적용</span>
              </label>
              <label>
                <input type="radio" name="orderBlock" value="off" />
                <span>미적용</span>
              </label>
            </div>
          </section>

          <nav class="controls" aria-label="차트 시간 선택">
            <button class="interval active" data-interval="1m">1분</button>
            <button class="interval" data-interval="5m">5분</button>
            <button class="interval" data-interval="15m">15분</button>
            <button class="interval" data-interval="1h">1시간</button>
            <button class="interval" data-interval="4h">4시간</button>
            <button class="interval" data-interval="1d">1일</button>
          </nav>

          <section class="setting-panel" aria-label="표시 봉 개수">
            <label for="candleCount">표시 봉 개수</label>
            <div class="number-control">
              <input id="candleCount" type="number" min="20" max="500" step="10" value="100" />
              <span>개</span>
            </div>
          </section>

          <details class="setting-panel ma-settings" aria-label="이동평균선 설정">
            <summary class="setting-label">이동평균선</summary>
            <div class="ma-setting-row">
              <span>MA 10</span>
              <input type="color" data-ma-color="10" value="#f7525f" aria-label="MA 10 색상" />
              <select data-ma-style="10" aria-label="MA 10 선 종류">
                <option value="solid">실선</option>
                <option value="dashed">파선</option>
                <option value="dotted">점선</option>
              </select>
              <select data-ma-width="10" aria-label="MA 10 선 굵기">
                <option value="1" selected>얇게</option>
                <option value="2">보통</option>
                <option value="3">굵게</option>
              </select>
            </div>
            <div class="ma-setting-row">
              <span>MA 20</span>
              <input type="color" data-ma-color="20" value="#ffb347" aria-label="MA 20 색상" />
              <select data-ma-style="20" aria-label="MA 20 선 종류">
                <option value="solid">실선</option>
                <option value="dashed">파선</option>
                <option value="dotted">점선</option>
              </select>
              <select data-ma-width="20" aria-label="MA 20 선 굵기">
                <option value="1" selected>얇게</option>
                <option value="2">보통</option>
                <option value="3">굵게</option>
              </select>
            </div>
            <div class="ma-setting-row">
              <span>MA 50</span>
              <input type="color" data-ma-color="50" value="#a78bfa" aria-label="MA 50 색상" />
              <select data-ma-style="50" aria-label="MA 50 선 종류">
                <option value="solid">실선</option>
                <option value="dashed">파선</option>
                <option value="dotted">점선</option>
              </select>
              <select data-ma-width="50" aria-label="MA 50 선 굵기">
                <option value="1">얇게</option>
                <option value="2" selected>보통</option>
                <option value="3">굵게</option>
              </select>
            </div>
            <div class="ma-setting-row">
              <span>MA 200</span>
              <input type="color" data-ma-color="200" value="#9ca3af" aria-label="MA 200 색상" />
              <select data-ma-style="200" aria-label="MA 200 선 종류">
                <option value="solid">실선</option>
                <option value="dashed">파선</option>
                <option value="dotted">점선</option>
              </select>
              <select data-ma-width="200" aria-label="MA 200 선 굵기">
                <option value="1" selected>얇게</option>
                <option value="2">보통</option>
                <option value="3">굵게</option>
              </select>
            </div>
          </details>
        </header>

        <section class="stats" aria-label="현재 시장 정보">
          <table class="market-table">
            <tbody>
              <tr>
                <th scope="row">24h 고가</th>
                <td id="highPrice">--</td>
              </tr>
              <tr>
                <th scope="row">24h 저가</th>
                <td id="lowPrice">--</td>
              </tr>
              <tr>
                <th scope="row">변동폭</th>
                <td id="highLowRange">--</td>
              </tr>
              <tr>
                <th scope="row">24h 거래량</th>
                <td id="volume">--</td>
              </tr>
              <tr>
                <th scope="row">상태</th>
                <td id="status">연결 준비</td>
              </tr>
            </tbody>
          </table>
        </section>
      </aside>

      <section class="chart-shell">
        <div class="chart-header">
          <span>캔들 + 거래량 · MA 10/20/50/200</span>
          <span>RSI 14/Signal 9 · MACD 12/26/9</span>
        </div>
        <div class="main-chart-wrap">
          <canvas id="maTrendOverlay" class="ma-trend-overlay" aria-hidden="true"></canvas>
          <canvas id="orderBlockOverlay" class="order-block-overlay" aria-hidden="true"></canvas>
          <div class="ma-legend" aria-label="이동평균선 범례">
            <span><i class="ma10"></i>MA 10</span>
            <span><i class="ma20"></i>MA 20</span>
            <span><i class="ma50"></i>MA 50</span>
            <span><i class="ma200"></i>MA 200</span>
          </div>
          <div id="chart" class="chart main-chart"></div>
        </div>
        <div class="indicator-row">
          <div class="indicator-title">RSI</div>
          <div id="rsiChart" class="chart indicator-chart"></div>
        </div>
        <div class="indicator-row">
          <div class="indicator-title">MACD</div>
          <div id="macdChart" class="chart indicator-chart"></div>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
